[project]
name = "mindscopex_analysis"
version = "0.1.0"
description = "Qwen + Qwen-Scope activation analysis with NNsight"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.52.4",
    "huggingface-hub>=0.24.0",
    "accelerate>=0.30.0",
    "nnsight>=0.5.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindscopex_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
