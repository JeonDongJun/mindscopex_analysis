# E2: discover the generalizing lure feature on the train split + null (2b).
# Writes discover_localization.csv (layer vs mean margin_delta vs null) and the
# study_feature.json used by the causal / behavioral stages.
[run]
name = "study_discover_2b"
job = "research_experiments"

[experiment]
kind = "discover"

[model]
profile = "2b"
dtype = "auto"
device_map = "auto"
sae_device = "auto"
sae_dtype = "auto"

[data]
dataset = "hagendorff_crt"
limit_per_family = 0
train_frac = 0.6
split_seed = 0
instruction = true

[discover]
candidate_top_n = 10
min_active_cases = 3
max_candidates = 24
max_cases = 24
coefficient = 1.0
intervention_mode = "remove_activation"
null_samples = 32
null_seed = 0
# layers = [5, 11, 17, 23]

[colab]
gpu = "A100"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
