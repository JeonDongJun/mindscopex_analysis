# CRT thinking-effect on the FRESH synthetic set (crt_fresh_v2, 150 items) — 9B.
# Same as 00_crt_fresh_v2_2b with [model].ids = 9B. Reasoning OFF/ON, forced
# correct-vs-lure (output_mode="binary_choice", no "other").
[run]
name = "00_crt_fresh_v2_9b"
job = "crt_text_responses"

[dataset]
preset = "crt_fresh_v2"

[model]
ids = ["Qwen/Qwen3.5-9B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [false, true]
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "G4"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
