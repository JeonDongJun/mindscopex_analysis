[run]
name = "00_hagendorff_full_qwen35_2b"
job = "crt_text_responses"

[dataset]
preset = "hagendorff_full"

[model]
ids = ["Qwen/Qwen3.5-2B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [false, true]
# Option B: reason freely, then prefix-constrain the final answer to correct/lure
# so the outcome is never "other". max_new_tokens is the *reasoning* budget; if the
# reasoning does not finish within it the answer is still forced (thinking_completed
# records whether reasoning finished), so 2048 is fine here and keeps it fast.
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "A100"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
