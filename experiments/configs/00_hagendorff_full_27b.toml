[run]
name = "00_hagendorff_full_qwen35_27b"
job = "crt_text_responses"

[dataset]
preset = "hagendorff_full"

[model]
ids = ["Qwen/Qwen3.5-27B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [false, true]
# Option B: reason freely, then prefix-constrain the final answer to correct/lure
# (never "other"). 27B fits a 96GB G4 (Blackwell) fully on-GPU; run on G4, not the
# 40GB A100. max_new_tokens is the reasoning budget (also capped to 2048 for large
# models); truncation still yields a forced answer (thinking_completed records it).
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "A100"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
