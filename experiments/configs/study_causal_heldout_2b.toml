# E3 (margin): apply the discovered feature to the HELD-OUT split (2b).
# Rediscovers the feature on train first (unless you pin one below), then reports
# the mean margin delta on unseen items. Writes causal_heldout.csv.
[run]
name = "study_causal_heldout_2b"
job = "research_experiments"

[experiment]
kind = "causal_heldout"

[model]
profile = "2b"
dtype = "auto"
device_map = "auto"
sae_device = "auto"
sae_dtype = "auto"

[data]
dataset = "hagendorff_crt"
limit_per_family = 0
train_frac = 0.6
split_seed = 0
instruction = true

[discover]
candidate_top_n = 10
min_active_cases = 3
max_candidates = 24
max_cases = 24
coefficient = 1.0
intervention_mode = "remove_activation"
null_samples = 32

[feature]
# Pin the feature from a previous discover run to skip rediscovery:
# layer = 11
# feature_id = 12345
coefficient = 1.0
intervention_mode = "remove_activation"

[colab]
gpu = "A100"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
